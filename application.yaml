apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: nginx-demo

  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/shrikant-nidasheshi/argocd-gitops-demo.git
    targetRevision: main
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true